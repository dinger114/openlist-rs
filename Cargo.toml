[package]
name = "openlist-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
# gzip/deflate：部分网盘 CDN（如蓝奏云）不协商直接返回压缩响应，
# 必须启用解压特性，否则 HTML/JSON 响应为乱码（Go net/http 自动处理，reqwest 需显式开启）
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "cookies", "gzip", "deflate", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
url = "2"
clap = { version = "4", features = ["derive"] }
rust-embed = "8"
regex = "1"
md-5 = "0.10"
sha1 = "0.10"
num-bigint = "0.4"
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
async-trait = "0.1"
# SSH/SFTP：russh 0.45 无 ring feature；Host key 类型来自 ssh-key
russh = "0.45"
russh-sftp = "2.0"
russh-keys = "0.45"
ssh-key = { version = "0.6", default-features = false, features = ["alloc"] }
# 持久化：redb 嵌入式 KV 库（单文件），账号数据 AES-256-GCM 加密后落盘
redb = "2"
aes-gcm = "0.10"
# AES-ECB：蓝奏云/飞鸡盘接口签名用（AES-128-ECB + PKCS7，手写填充）
aes = "0.8"

[profile.release]
strip = "symbols"
debug = false
