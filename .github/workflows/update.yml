name: update

# 每周刷新 Cargo.lock（cargo update），有变化就开 PR 让 CI 把关，而不是直推 master。
#
# 为什么不再直推：GITHUB_TOKEN 造成的 push 不会触发 push 工作流 —— 直推 master 意味着
# 那次锁文件更新没有任何 CI 记录；而且 cargo update 会带进传递依赖的新版本，一旦编不过
# master 就红了。改成开 PR 后：CI 在 PR 上跑，绿了再合（这一步留给人点）。
#
# 为什么开完 PR 还要 dispatch ci：同样是 GITHUB_TOKEN 的限制 —— 它创建的 PR 不会触发
# pull_request 工作流。显式 dispatch 一次 ci（跑在同一个 SHA 上），PR 上才会有 check。
on:
  schedule:
    # 周一 03:23（CST）—— 比 Dependabot 的 03:00 稍晚，避免同时抢写 Cargo.lock
    - cron: "23 19 * * 0"
  workflow_dispatch:

permissions:
  contents: write      # 推分支
  pull-requests: write # 开 PR
  actions: write       # 补 ci dispatch

concurrency:
  group: update-lockfile
  cancel-in-progress: false

jobs:
  update-lockfile:
    name: update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo update
        run: cargo update

      - name: 有变化就开/更新 PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: chore/cargo-update
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock 无变化，收工"
            exit 0
          fi

          echo "=== Cargo.lock 变更摘要 ==="
          git diff --stat -- Cargo.lock

          git switch -c "$BRANCH"
          git add Cargo.lock
          git commit -m "chore: 每周 cargo update（刷新 Cargo.lock）"
          git push -f origin "$BRANCH"

          CREATED=0
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            echo "已有对应 PR，分支已强制更新，PR 会自己跟着变"
          else
            BODY=$(printf '%s\n' \
              '定时任务（.github/workflows/update.yml，每周一 03:23 CST）跑 `cargo update` 的产物。' \
              '' \
              '只动 `Cargo.lock`，不改 `Cargo.toml` 的版本要求 —— 刷的是约束范围内的最新版本（含传递依赖）。' \
              '' \
              '⚠️ 传递依赖的 0.x 小版本跳级同样可能是破坏性变更，所以这个 PR **不自动合并**：看 CI（cargo check / clippy / test）结果再决定，红了直接关掉即可。')
            gh pr create --base master --head "$BRANCH" \
              --title "chore: 每周 cargo update（刷新 Cargo.lock）" \
              --body "$BODY"
            CREATED=1
          fi

          # GITHUB_TOKEN 创建的 PR 不会自动触发 pull_request 工作流：GitHub 会把这批运行
          # 挂成 action_required（等人工批准），PR 上因此看不到 check。用 approve 接口自动放行，
          # PR 页面上就会出现真正的 CI 记录；万一没找到挂起的运行（行为有变），再用 dispatch 兜底。
          if [ "$CREATED" -eq 1 ]; then
            APPROVED=0
            for _ in $(seq 1 12); do   # 最多等 60 秒让那批运行出现
              IDS=$(gh run list --branch "$BRANCH" --event pull_request --limit 5 \
                      --json databaseId,conclusion \
                      --jq '.[] | select(.conclusion == "action_required") | .databaseId')
              if [ -n "$IDS" ]; then
                for id in $IDS; do
                  gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/approve" >/dev/null \
                    && echo "已放行挂起的运行 $id"
                done
                APPROVED=1
                break
              fi
              sleep 5
            done
            if [ "$APPROVED" -eq 0 ]; then
              echo "没找到挂起的运行，改用 workflow_dispatch 兜底"
              gh workflow run ci.yml --ref "$BRANCH" || true
            fi
          fi
