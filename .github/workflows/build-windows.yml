name: build-windows

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: openlist-rs

jobs:
  build:
    name: build (windows-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 前端构建（产物 web/dist 由 rust-embed 在编译期嵌入）
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build frontend
        working-directory: web
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npm run build

      # 2. Rust 工具链（MSVC，Windows 原生）
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-msvc

      # 3. 编译（rustls TLS，无 openssl 依赖）
      - name: Build release
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      # 4. 打包上传（artifact 保留 7 天，Actions 页面下载）
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/$env:BIN_NAME.exe" "dist/$env:BIN_NAME.exe"
          Compress-Archive -Path "dist/$env:BIN_NAME.exe" -DestinationPath "openlist-rs-windows-x64.zip" -Force
          $h = (Get-FileHash "openlist-rs-windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "$h  openlist-rs-windows-x64.zip" | Out-File -Encoding ascii "openlist-rs-windows-x64.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openlist-rs-windows-x64
          path: |
            openlist-rs-windows-x64.zip
            openlist-rs-windows-x64.zip.sha256
          retention-days: 7
